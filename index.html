<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3138">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>AppHub</title>
<style>
:root{--bg:#F3F6F7;--card:#fff;--ink:#0F2A30;--muted:#5A7378;--line:#D8E3E5;--brand:#0F5964;--brand-ink:#fff;--ok:#1F9D55;--warn:#F08A1C;--danger:#C0392B}
@media (prefers-color-scheme:dark){:root{--bg:#0B1A1E;--card:#12272D;--ink:#E6F2F3;--muted:#92B0B5;--line:#21424A;--brand:#37B6C6;--brand-ink:#06242A;--ok:#4CD38A;--warn:#FFA94D;--danger:#FF7A6B}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:max(24px,env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
header.top h1{font-size:20px;margin:0;flex:1}
main{max-width:720px;margin:0 auto;padding:16px}
button,.btn{font:inherit;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.primary,.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.totais{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tot b{display:block;font-size:28px;line-height:1.1}
.tot span{color:var(--muted);font-size:14px}
.lista{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.app{width:100%;text-align:left;justify-content:flex-start;min-height:64px;padding:10px 14px;gap:12px}
.app .nome{flex:1;min-width:0}
.app .nome b{display:block}
.app .nome small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.chev{color:var(--muted);font-size:22px}
section.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
section.box h2{font-size:18px;margin:0 0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:22px}
.kv span{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px}
textarea{min-height:96px;resize:vertical}
.tarefas{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tarefa{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 8px}
.tarefa input[type=checkbox]{width:26px;height:26px;flex:none}
.tarefa .txt{flex:1;min-width:0;word-break:break-word}
.tarefa.feita .txt{text-decoration:line-through;color:var(--muted)}
.tarefa button{min-height:44px;padding:0 12px}
.danger{color:var(--danger);border-color:var(--danger)}
.redes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.telas{margin:8px 0 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90vw}
label.l{display:block;font-weight:700;margin:12px 0 4px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.album .mi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);padding:0;min-height:0;cursor:pointer}
.album .mi img,.album .mi video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.album .mi .pl{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:2px 8px;font-size:13px}
.visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.visor .m{max-width:100%;max-height:68vh;border-radius:8px}
.visor .acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---- visual colorido ---- */
:root{--acc:#0F5964;--bgf:linear-gradient(180deg,#E3F4F6 0,#F3F6F7 260px)}
@media (prefers-color-scheme:dark){:root{--bgf:linear-gradient(180deg,#10353C 0,#0B1A1E 260px)}}
body{background:var(--bgf) no-repeat,var(--bg);background-color:var(--bg)}
header.top{background:linear-gradient(135deg,#0F5964,#1B8A9A);color:#fff;border-bottom:0;box-shadow:0 3px 14px rgba(15,89,100,.28)}
header.top button{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.tot{border:0;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:2px}
.tot span{color:rgba(255,255,255,.92)}
.tot .ic{font-size:22px;line-height:1}
.tot.t1{background:linear-gradient(135deg,#0F5964,#1B8A9A)}
.tot.t2{background:linear-gradient(135deg,#C2410C,#F08A1C)}
.tot.t3{background:linear-gradient(135deg,#6D28D9,#8B5CF6)}
.tot.t4{background:linear-gradient(135deg,#15803D,#22A559)}
.app{border-left:6px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .12s}
.app:active{transform:scale(.985)}
.av{width:46px;height:46px;border-radius:14px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#000));color:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero .av{background:rgba(255,255,255,.22);width:58px;height:58px;font-size:32px;border-radius:18px}
.hero b{font-size:21px;display:block;line-height:1.2}
.hero small{opacity:.92;word-break:break-all}
.hero .st{display:inline-block;margin-top:6px;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:14px}
section.box{border:0;border-top:4px solid var(--acc);box-shadow:0 3px 12px rgba(0,0,0,.07)}
section.box h2{color:var(--acc)}
@media (prefers-color-scheme:dark){section.box h2{color:color-mix(in srgb,var(--acc) 45%,#fff)}}
button.primary,.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.redes button:nth-child(1){background:#FF0000;color:#fff;border-color:#FF0000}
.redes button:nth-child(2){background:#1877F2;color:#fff;border-color:#1877F2}
.redes button:nth-child(3){background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff;border-color:transparent}
.redes button:nth-child(4){background:#111;color:#fff;border-color:#111}
.redes button{font-weight:700}
.kit{margin-top:14px;padding:12px;border-radius:14px;background:var(--bg);border:2px solid var(--acc)}
.kit h3{margin:0 0 8px;color:var(--acc)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <button id="btnVoltar" type="button" aria-label="Voltar" hidden>‹</button>
  <h1 id="titulo">AppHub</h1>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============ Lista de apps (edite aqui para incluir apps novos) ============ */
var APPS = [
  {id:'imperio', nome:'Império das Máquinas', dominio:'imperiodasmaquinaspesadas.com.br', ga:'G-CKZJJV1B8E', prop:'558330735', desc:'Jogo de estratégia: gerencie uma empresa de máquinas pesadas, faça manutenção, escolha contratos e construa seu império.', tags:'#ImperioDasMaquinas #jogosmobile #jogodeestrategia #maquinaspesadas #jogosoffline #gamedev #jogosbrasileiros #simulador #games #gamer'},
  {id:'babadopet', nome:'Babá do Pet', dominio:'babadopet.com.br', ga:'G-G16QMJ72XX', prop:'564494964', desc:'App grátis de cuidados com pets: agenda, lembretes e dicas para o dia a dia do seu bichinho. Sem cadastro.', tags:'#BabaDoPet #pets #petlovers #cuidadoscompet #cachorro #gato #maedepet #paidepet #amordepet #instapet'},
  {id:'smartfinance', nome:'Smart Finance Family', dominio:'smartfinancefamily.com.br', ga:'G-Z7FZXMZ9QB', prop:'564509968', desc:'Controle financeiro da família, com os dados guardados só no seu aparelho.', tags:'#SmartFinanceFamily #educacaofinanceira #financaspessoais #controlefinanceiro #organizacaofinanceira #orcamentofamiliar #dinheiro #financasfamiliares #dicasdefinancas #planilhadegastos'},
  {id:'achados', nome:'Achados de Condomínio', dominio:'achadosdecondominios.com.br', ga:'G-DQJZF2ZTJP', prop:'561777992', desc:'Compre, venda e troque com os vizinhos do seu condomínio, com segurança e sem sair do prédio.', tags:'#AchadosDeCondominio #condominio #sindico #vizinhos #moradores #vidaemcondominio #comprasevendas #brecho #desapego #apartamento'},
  {id:'gemmo', nome:'Gemmo Combo', dominio:'gemmo.com.br', ga:'G-776C53RGP8', prop:'564516381', desc:'Jogo de combinar gemas com fases, combos e prêmios. Grátis, sem cadastro.', tags:'#GemmoCombo #match3 #jogosdepuzzle #jogosmobile #jogosgratis #jogosoffline #jogosbrasileiros #puzzle #games #gamer'},
  {id:'telejogo', nome:'Telegame77 Vintage', dominio:'telegame77.com.br', ga:'G-JMCS7PB32Z', prop:'558926521', desc:'Telegame77: o clássico jogo de raquete e bola dos anos 70, em 3D. Paredão, tênis, futebol e barreira, com campeonato e ranking. Grátis e funciona sem internet.', tags:'#Telegame77 #jogosretro #jogosvintage #retrogames #jogosclassicos #anos70 #jogosmobile #jogosgratis #jogosoffline #games'},
  {id:'radar', nome:'Radar de golpes', dominio:'', ga:'', desc:'', tags:'', obs:'Ainda sem divulgação, em teste.'}
];
var VIS={imperio:['🚜','#B45309'],babadopet:['🐾','#DB2777'],smartfinance:['💰','#2563EB'],achados:['🏢','#7C3AED'],gemmo:['💎','#E11D48'],telejogo:['🕹️','#0E7490'],radar:['📡','#475569']};
function vis(id){ return VIS[id]||['📱','#0F5964']; }
var KEY='apphub.v1';
var estado = {tarefas:{}, textos:{}};
var dados = {atualizado:null, apps:{}};

try{ var salvo=JSON.parse(localStorage.getItem(KEY)||'null'); if(salvo&&salvo.tarefas) estado=salvo; if(!estado.textos) estado.textos={}; }catch(e){}
function salvar(){ try{ localStorage.setItem(KEY, JSON.stringify(estado)); }catch(e){} }

var $=function(id){return document.getElementById(id);};
function el(tag, props, kids){
  var n=document.createElement(tag);
  Object.keys(props||{}).forEach(function(k){
    if(k==='text') n.textContent=props[k];
    else if(k==='class') n.className=props[k];
    else if(k.indexOf('on')===0) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  });
  (kids||[]).forEach(function(c){ if(c) n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},1800); }
function copiar(txt){
  function fallback(){ var ta=el('textarea',{}); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('Copiado');}catch(e){toast('Não consegui copiar');} ta.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('Copiado');},fallback); } else fallback();
}
function abertas(id){ return (estado.tarefas[id]||[]).filter(function(t){return !t.feita;}).length; }
function fmtNum(n){ return (n===null||n===undefined)?'—':new Intl.NumberFormat('pt-BR').format(n); }
function fmtTempo(s){ if(s===null||s===undefined) return '—'; var m=Math.floor(s/60), r=Math.round(s%60); return m+'min '+(r<10?'0':'')+r+'s'; }
function getApp(id){ return APPS.filter(function(a){return a.id===id;})[0]; }
function textoApp(a){ var t=estado.textos[a.id]||{}; return {desc:(t.desc!==undefined?t.desc:a.desc), tags:(t.tags!==undefined?t.tags:a.tags)}; }

/* ============ Tela principal ============ */
function telaPrincipal(){
  document.title='AppHub'; $('titulo').textContent='AppHub'; $('btnVoltar').hidden=true;
  var m=$('main'); m.textContent=''; m.style.removeProperty('--acc');
  var comPend=APPS.filter(function(a){return abertas(a.id)>0;}).length;
  var totAbertas=APPS.reduce(function(s,a){return s+abertas(a.id);},0);
  var totUsuarios=null; Object.keys(dados.apps||{}).forEach(function(k){ var u=dados.apps[k]&&dados.apps[k].usuarios; if(typeof u==='number') totUsuarios=(totUsuarios||0)+u; });
  var tot=el('div',{class:'totais'},[
    el('div',{class:'tot t1'},[el('span',{class:'ic',text:'📱'}),el('b',{text:String(APPS.length)}),el('span',{text:'apps'})]),
    el('div',{class:'tot t2'},[el('span',{class:'ic',text:'⚠️'}),el('b',{text:String(comPend)}),el('span',{text:'com pendências'})]),
    el('div',{class:'tot t3'},[el('span',{class:'ic',text:'✅'}),el('b',{text:String(totAbertas)}),el('span',{text:'tarefas abertas'})]),
    el('div',{class:'tot t4'},[el('span',{class:'ic',text:'👥'}),el('b',{text:fmtNum(totUsuarios)}),el('span',{text:'usuários (30 dias)'})])
  ]);
  m.appendChild(tot);
  var ul=el('ul',{class:'lista'});
  APPS.forEach(function(a){
    var n=abertas(a.id);
    var v=vis(a.id);
    var b=el('button',{class:'app',type:'button',style:'--acc:'+v[1],onclick:function(){location.hash='#/app/'+a.id;}},[
      el('span',{class:'av','aria-hidden':'true',text:v[0]}),
      el('span',{class:'nome'},[el('b',{text:a.nome}),el('small',{text:(n>0?n+(n===1?' tarefa aberta':' tarefas abertas'):'Em ordem')+(a.dominio?' · '+a.dominio:'')})]),
      el('span',{class:'dot '+(n>0?'warn':'ok'),'aria-hidden':'true'}),
      el('span',{class:'chev','aria-hidden':'true',text:'›'})
    ]);
    b.setAttribute('aria-label', a.nome+', '+(n>0?n+' pendências':'em ordem'));
    ul.appendChild(el('li',{},[b]));
  });
  m.appendChild(ul);
  m.appendChild(el('p',{class:'muted',text:'Laranja: tem pendências. Verde: em ordem.'}));
  m.appendChild(el('p',{class:'muted',text:dados.atualizado?('Números do Google Analytics atualizados em '+new Date(dados.atualizado).toLocaleString('pt-BR')+'.'):'Números do Google Analytics: ainda não conectados.'}));
}

/* ============ Tela do app ============ */
function telaApp(id){
  var a=getApp(id); if(!a){ location.hash=''; return; }
  document.title=a.nome+' — AppHub'; $('titulo').textContent=a.nome; $('btnVoltar').hidden=false;
  var m=$('main'); m.textContent='';
  var v=vis(a.id); m.style.setProperty('--acc',v[1]);
  var n0=abertas(a.id);
  m.appendChild(el('div',{class:'hero'},[
    el('span',{class:'av','aria-hidden':'true',text:v[0]}),
    el('div',{},[el('b',{text:a.nome}),el('small',{text:a.dominio||'Sem endereço ainda'}),el('br'),el('span',{class:'st',text:n0>0?('🟠 '+n0+(n0===1?' tarefa aberta':' tarefas abertas')):'🟢 Em ordem'})])
  ]));
  var d=(dados.apps||{})[a.id];

  /* dados */
  var caixa=el('section',{class:'box'},[el('h2',{text:'Dados'})]);
  if(d){
    caixa.appendChild(el('div',{class:'kv'},[
      el('div',{},[el('b',{text:fmtNum(d.usuarios)}),el('span',{text:'usuários (30 dias)'})]),
      el('div',{},[el('b',{text:fmtNum(d.sessoes)}),el('span',{text:'sessões'})]),
      el('div',{},[el('b',{text:fmtTempo(d.tempo_medio_s)}),el('span',{text:'tempo médio'})]),
      el('div',{},[el('b',{text:fmtNum(d.visualizacoes)}),el('span',{text:'visualizações'})])
    ]));
    if(d.telas&&d.telas.length){
      caixa.appendChild(el('h2',{text:'Telas mais usadas',style:'margin-top:14px'}));
      var ol=el('ol',{class:'telas'}); d.telas.slice(0,8).forEach(function(t){ ol.appendChild(el('li',{text:t.nome+' — '+fmtNum(t.visualizacoes)})); }); caixa.appendChild(ol);
    }
  } else {
    caixa.appendChild(el('p',{class:'muted',text:a.ga?('Ainda sem números aqui. O Google Analytics deste app já está ligado ('+a.ga+').'):'Este app ainda não tem Google Analytics.'}));
  }
  if(a.obs) caixa.appendChild(el('p',{class:'muted',text:a.obs}));
  var linha=el('div',{class:'row',style:'margin-top:10px;flex-wrap:wrap'});
  if(a.dominio) linha.appendChild(el('a',{class:'btn',href:'https://'+a.dominio,target:'_blank',rel:'noopener',text:'Abrir o app'}));
  linha.appendChild(el('a',{class:'btn',href:'https://analytics.google.com/analytics/web/'+(a.prop?'#/p'+a.prop+'/reports/intelligenthome':''),target:'_blank',rel:'noopener',text:'Abrir o Google Analytics'}));
  caixa.appendChild(linha);
  m.appendChild(caixa);

  /* tarefas */
  var tb=el('section',{class:'box'},[el('h2',{text:'Tarefas'})]);
  var inp=el('input',{type:'text',id:'novaTarefa',placeholder:'Nova tarefa','aria-label':'Nova tarefa',autocomplete:'off'});
  var add=el('button',{class:'primary',type:'button',text:'Adicionar',onclick:function(){ addTarefa(a.id, inp.value); }});
  var mic=el('button',{type:'button','aria-label':'Adicionar por voz',text:'🎤',onclick:function(){ voz(a.id, inp); }});
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') addTarefa(a.id, inp.value); });
  tb.appendChild(el('div',{class:'row'},[inp,mic,add]));
  var ul=el('ul',{class:'tarefas',id:'listaTarefas'}); tb.appendChild(ul);
  m.appendChild(tb);
  desenhaTarefas(a.id);

  /* divulgação */
  var dv=el('section',{class:'box'},[el('h2',{text:'Divulgação'})]);
  var painel=el('div',{id:'painelDiv',hidden:'hidden'});
  dv.appendChild(el('button',{class:'primary',type:'button',text:'Divulgar este app',onclick:function(){ painel.hidden=!painel.hidden; }}));
  var tx=textoApp(a); if(!String(tx.tags||'').trim()) tx.tags=a.tags||''; if(!String(tx.desc||'').trim()) tx.desc=a.desc||'';
  var end=el('input',{type:'text',value:a.dominio?('https://'+a.dominio):'',readonly:'readonly','aria-label':'Endereço'});
  var desc=el('textarea',{'aria-label':'Descrição'}); desc.value=tx.desc;
  var tags=el('textarea',{'aria-label':'Hashtags'}); tags.value=tx.tags;
  function guardaTextos(){ estado.textos[a.id]={desc:desc.value,tags:tags.value}; salvar(); }
  desc.addEventListener('input',guardaTextos); tags.addEventListener('input',guardaTextos);
  painel.appendChild(el('label',{class:'l',text:'Endereço'})); painel.appendChild(end);
  painel.appendChild(el('button',{type:'button',text:'Copiar endereço',style:'margin-top:6px',onclick:function(){copiar(end.value);}}));
  painel.appendChild(el('label',{class:'l',text:'Descrição'})); painel.appendChild(desc);
  painel.appendChild(el('button',{type:'button',text:'Copiar descrição',style:'margin-top:6px',onclick:function(){copiar(desc.value);}}));
  painel.appendChild(el('label',{class:'l',text:'Hashtags'})); painel.appendChild(tags);
  painel.appendChild(el('button',{type:'button',text:'Copiar hashtags',style:'margin-top:6px',onclick:function(){copiar(tags.value);}}));
  painel.appendChild(el('p',{class:'muted',text:'Toque na rede para montar o kit pronto (descrição + endereço + hashtags):',style:'margin-top:14px'}));
  function tagsAtuais(){ return tags.value.trim()?tags.value:(a.tags||''); }
  function ht(n){ return (tagsAtuais().match(/#[^\s#]+/g)||[]).slice(0,n).join(' '); }
  var kit=el('div',{id:'kit',class:'kit',hidden:'hidden'});
  var REDES=[['YouTube',5,'https://studio.youtube.com'],['Facebook',5,'https://www.facebook.com'],['Instagram',10,'https://www.instagram.com'],['TikTok',5,'https://www.tiktok.com/upload']];
  function abreKit(r){
    var texto=[desc.value.trim()||a.desc, end.value.trim(), ht(r[1])].filter(Boolean).join('\n\n');
    kit.textContent=''; kit.hidden=false;
    kit.appendChild(el('h3',{text:'Kit para '+r[0]}));
    var ta=el('textarea',{'aria-label':'Texto do kit'}); ta.value=texto; ta.style.minHeight='170px'; kit.appendChild(ta);
    kit.appendChild(el('p',{class:'muted',text:'Toque em "Copiar tudo pronto", abra o '+r[0]+' e cole no post. O texto já inclui descrição, endereço e '+r[1]+' hashtags (pode editar acima).'}));
    var acoes=el('div',{style:'display:flex;flex-direction:column;gap:8px;margin-top:8px'});
    acoes.appendChild(el('button',{class:'primary',type:'button',text:'📋 Copiar tudo pronto',onclick:function(){ copiar(ta.value); }}));
    acoes.appendChild(el('a',{class:'btn',href:r[2],target:'_blank',rel:'noopener',text:'Copiar e abrir o '+r[0],onclick:function(){ copiar(ta.value); }}));
    kit.appendChild(acoes);
    var mais=el('details',{style:'margin-top:12px'},[el('summary',{text:'Mais opções (fotos e vídeos, escolher destino)'})]);
    var extra=el('div',{style:'display:flex;flex-direction:column;gap:8px;margin-top:8px'});
    extra.appendChild(el('button',{type:'button',text:'Compartilhar com fotos/vídeos do álbum',onclick:function(){
      copiar(ta.value);
      midiasDoApp(a.id).then(function(L){
        var files=L.slice(0,10).map(function(m){ return new File([m.blob],m.nome,{type:m.tipo}); });
        if(files.length&&navigator.canShare&&navigator.canShare({files:files})){ navigator.share({files:files,text:ta.value}).catch(function(){}); }
        else if(navigator.share){ if(!files.length) toast('Álbum vazio: compartilhando só o texto'); navigator.share({text:ta.value}).catch(function(){}); }
        else toast('Este navegador não compartilha. Texto copiado.');
      }).catch(function(){ if(navigator.share) navigator.share({text:ta.value}).catch(function(){}); });
    }}));
    if(r[0]==='Facebook'&&end.value.trim()){
      extra.appendChild(el('a',{class:'btn',href:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(end.value.trim()),target:'_blank',rel:'noopener',text:'Compartilhar só o link (escolher perfil, grupo ou página)',onclick:function(){ copiar(ta.value); }}));
    }
    mais.appendChild(extra); kit.appendChild(mais);
    kit.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  var redes=el('div',{class:'redes'});
  REDES.forEach(function(r){ redes.appendChild(el('button',{type:'button',text:r[0],onclick:function(){ abreKit(r); }})); });
  painel.appendChild(redes);
  painel.appendChild(kit);
  dv.appendChild(painel);
  m.appendChild(dv);
  m.appendChild(secaoAlbum(a));
}


/* ============ Álbum de fotos e vídeos (fica neste aparelho, em IndexedDB) ============ */
var _db=null;
function abreDB(){
  return new Promise(function(ok,no){
    if(_db) return ok(_db);
    if(!window.indexedDB) return no(new Error('sem IndexedDB'));
    var rq=indexedDB.open('apphub-album',1);
    rq.onupgradeneeded=function(){ var st=rq.result.createObjectStore('midias',{keyPath:'id'}); st.createIndex('app','app'); };
    rq.onsuccess=function(){ _db=rq.result; ok(_db); };
    rq.onerror=function(){ no(rq.error); };
  });
}
function dbTx(modo,fn){
  return abreDB().then(function(db){ return new Promise(function(ok,no){
    var tx=db.transaction('midias',modo), st=tx.objectStore('midias'), r=fn(st);
    tx.oncomplete=function(){ ok(r&&r.result); }; tx.onerror=function(){ no(tx.error); }; tx.onabort=function(){ no(tx.error); };
  }); });
}
function midiasDoApp(app){ return dbTx('readonly',function(st){ return st.index('app').getAll(app); }).then(function(l){ return (l||[]).sort(function(a,b){return b.t-a.t;}); }); }
function guardaMidia(m){ return dbTx('readwrite',function(st){ return st.put(m); }); }
function apagaMidia(id){ return dbTx('readwrite',function(st){ return st.delete(id); }); }
function fmtMB(b){ return (b/1048576).toFixed(b<10485760?1:0).replace('.',',')+' MB'; }

var _urls=[];
function limpaUrls(){ _urls.forEach(function(u){URL.revokeObjectURL(u);}); _urls=[]; }
function urlDe(blob){ var u=URL.createObjectURL(blob); _urls.push(u); return u; }

function secaoAlbum(a){
  var box=el('section',{class:'box'},[el('h2',{text:'Fotos e vídeos'})]);
  box.appendChild(el('p',{class:'muted',text:'Guarde aqui o material de divulgação deste app. Fica só neste aparelho.'}));
  var inp=el('input',{type:'file',accept:'image/*,video/*',multiple:'multiple',hidden:'hidden'});
  var info=el('p',{class:'muted'});
  var grade=el('div',{class:'album'});
  var btn=el('button',{class:'primary',type:'button',text:'Adicionar fotos e vídeos',onclick:function(){ inp.click(); }});
  box.appendChild(btn); box.appendChild(inp); box.appendChild(info); box.appendChild(grade);

  function desenha(){
    midiasDoApp(a.id).then(function(L){
      limpaUrls(); grade.textContent='';
      var total=L.reduce(function(s,m){return s+(m.blob?m.blob.size:0);},0);
      info.textContent=L.length?(L.length+(L.length===1?' arquivo':' arquivos')+' · '+fmtMB(total)):'Nenhum arquivo ainda.';
      L.forEach(function(m){
        var video=m.tipo.indexOf('video')===0;
        var u=urlDe(m.blob);
        var mi=el('button',{class:'mi',type:'button','aria-label':(video?'Vídeo ':'Foto ')+m.nome,onclick:function(){ visor(m,u,video,desenha); }});
        if(video){ var v=el('video',{preload:'metadata',muted:'muted',playsinline:'playsinline'}); v.src=u+'#t=0.1'; mi.appendChild(v); mi.appendChild(el('span',{class:'pl',text:'▶'})); }
        else mi.appendChild(el('img',{src:u,alt:'',loading:'lazy'}));
        grade.appendChild(mi);
      });
    }).catch(function(){ info.textContent='Não consegui abrir o álbum neste navegador.'; });
  }
  inp.addEventListener('change',function(){
    var fs=Array.prototype.slice.call(inp.files||[]); inp.value='';
    if(!fs.length) return;
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
    var feitos=0;
    fs.reduce(function(p,f){
      return p.then(function(){
        if(!/^(image|video)\//.test(f.type)) return;
        return guardaMidia({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),app:a.id,nome:f.name||'arquivo',tipo:f.type,blob:f,t:Date.now()}).then(function(){feitos++;});
      });
    },Promise.resolve()).then(function(){ toast(feitos+(feitos===1?' arquivo salvo':' arquivos salvos')); desenha(); })
    .catch(function(){ toast('Sem espaço ou erro ao salvar'); desenha(); });
  });
  desenha();
  return box;
}

function visor(m,u,video,depois){
  var v=el('div',{class:'visor',role:'dialog','aria-label':'Visualizar'});
  var midia=video?el('video',{class:'m',controls:'controls',playsinline:'playsinline',autoplay:'autoplay'}):el('img',{class:'m',alt:''});
  midia.src=u;
  function fecha(){ v.remove(); }
  var acoes=el('div',{class:'acoes'});
  acoes.appendChild(el('button',{class:'primary',type:'button',text:'Compartilhar',onclick:function(){
    var f=new File([m.blob],m.nome,{type:m.tipo});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(function(){}); }
    else toast('Este navegador não compartilha arquivos. Use Baixar.');
  }}));
  acoes.appendChild(el('button',{type:'button',text:'Baixar',onclick:function(){
    var a=el('a',{href:u,download:m.nome}); document.body.appendChild(a); a.click(); a.remove();
  }}));
  var del=el('button',{type:'button',class:'danger',text:'Apagar',onclick:function(){
    if(del._ok){ apagaMidia(m.id).then(function(){ fecha(); depois(); toast('Apagado'); }); }
    else { del._ok=true; del.textContent='Confirmar?'; setTimeout(function(){ del._ok=false; del.textContent='Apagar'; },3000); }
  }});
  acoes.appendChild(del);
  acoes.appendChild(el('button',{type:'button',text:'Fechar',onclick:fecha}));
  v.appendChild(midia); v.appendChild(acoes);
  v.addEventListener('click',function(e){ if(e.target===v) fecha(); });
  document.body.appendChild(v);
}

/* ============ Tarefas ============ */
function lista(id){ if(!estado.tarefas[id]) estado.tarefas[id]=[]; return estado.tarefas[id]; }
function addTarefa(id, txt){
  txt=(txt||'').trim(); if(!txt){ toast('Escreva a tarefa'); return; }
  lista(id).unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6), txt:txt, feita:false});
  salvar(); var i=$('novaTarefa'); if(i) i.value=''; desenhaTarefas(id);
}
function desenhaTarefas(id){
  var ul=$('listaTarefas'); if(!ul) return; ul.textContent='';
  var L=lista(id);
  if(!L.length){ ul.appendChild(el('li',{class:'muted',text:'Nenhuma tarefa.'})); return; }
  L.forEach(function(t){
    var li=el('li',{class:'tarefa'+(t.feita?' feita':'')});
    var cb=el('input',{type:'checkbox','aria-label':'Concluída'}); cb.checked=t.feita;
    cb.addEventListener('change',function(){ t.feita=cb.checked; salvar(); desenhaTarefas(id); });
    var txt=el('span',{class:'txt',text:t.txt});
    var ed=el('button',{type:'button',text:'Editar',onclick:function(){
      var inp=el('input',{type:'text','aria-label':'Editar tarefa'}); inp.value=t.txt;
      var ok=el('button',{class:'primary',type:'button',text:'Salvar',onclick:function(){ var v=inp.value.trim(); if(v){ t.txt=v; salvar(); } desenhaTarefas(id); }});
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') ok.click(); });
      li.textContent=''; li.appendChild(inp); li.appendChild(ok); inp.focus();
    }});
    var del=el('button',{type:'button',class:'danger',text:'Apagar',onclick:function(){
      if(del._ok){ var i=L.indexOf(t); if(i>=0) L.splice(i,1); salvar(); desenhaTarefas(id); }
      else { del._ok=true; del.textContent='Confirmar?'; setTimeout(function(){ del._ok=false; del.textContent='Apagar'; },3000); }
    }});
    li.appendChild(cb); li.appendChild(txt); li.appendChild(ed); li.appendChild(del);
    ul.appendChild(li);
  });
}
function voz(id, inp){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Este navegador não tem ditado por voz'); return; }
  var r=new SR(); r.lang='pt-BR'; r.interimResults=false; r.maxAlternatives=1;
  toast('Pode falar...');
  r.onresult=function(e){ var t=e.results[0][0].transcript; addTarefa(id, t.charAt(0).toUpperCase()+t.slice(1)); };
  r.onerror=function(){ toast('Não consegui ouvir'); };
  try{ r.start(); }catch(e){ toast('Não consegui iniciar o microfone'); }
}

/* ============ Rotas ============ */
function rota(){
  limpaUrls();
  var h=location.hash||''; var m=h.match(/^#\/app\/([\w-]+)/);
  if(m) telaApp(m[1]); else telaPrincipal();
  window.scrollTo(0,0);
}
$('btnVoltar').addEventListener('click',function(){ location.hash=''; });
window.addEventListener('hashchange',rota);
rota();

fetch('dados.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(j&&j.apps){ dados=j; rota(); } }).catch(function(){});
